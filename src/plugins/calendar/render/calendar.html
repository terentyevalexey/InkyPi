{% extends "plugin.html" %}

{% block content %}

<script src="{{static_dir}}/scripts/calendar.min.js" charset="UTF-8"></script>
<script src="{{static_dir}}/scripts/calendar.locales.min.js" charset="UTF-8"></script>

<div id="calendar" class="calendar" style="
--fc-page-bg-color: {{ plugin_settings.backgroundColor or white }};
--fc-border-color: {{ plugin_settings.textColor }};
--fc-today-bg-color: '';
--fc-now-indicator-color: {{ plugin_settings.nowIndicatorColor or red }};
--fc-event-border-color: {{ plugin_settings.textColor or white }};

--fc-small-font-size: {{ 0.85 * font_scale }}em;
--fc-title-font-size: {{ 1.75 * font_scale }}em;
--fc-table-font-size: {{ 1 * font_scale }}em;

--all-day-per-line: {{ all_day_per_line }};
--all-day-lines: {{ all_day_lines }};
--all-day-gap: 2px;
--all-day-line-height: {{ (1.7 if all_day_lines == 1 else 1.05) * font_scale }}em;
">

</div>

<script>
    const events = {{ events | tojson }};
    const locale = "{{ plugin_settings.language or 'en' }}";

    // Plural forms are supplied in CLDR order (one|few|many|other) and clamped to
    // however many the author wrote, so "+{n} event|+{n} events" works for English
    // and "+{n} событие|+{n} события|+{n} событий" works for Russian.
    const OVERFLOW_FORMS = {{ (plugin_settings.allDayOverflowLabel or '') | tojson }};
    const CLDR_ORDER = ['one', 'few', 'many', 'other'];

    function overflowLabel(count) {
        const forms = OVERFLOW_FORMS.split('|').filter(f => f.length);
        if (!forms.length) return '+' + count;
        let index = forms.length - 1;
        try {
            const category = new Intl.PluralRules(locale).select(count);
            const position = CLDR_ORDER.indexOf(category);
            if (position >= 0) index = Math.min(position, forms.length - 1);
        } catch (e) {
            // Unknown locale: fall back to the last form.
        }
        return forms[index].replace('{n}', count);
    }

    // In a one-hour box the time label takes a line of its own and leaves the title
    // a single line before it has to truncate. FullCalendar's own compact style puts
    // the two on one line, which hands that line back to the title; it only applies
    // the style to much shorter events, so extend it to any box that cannot give the
    // title two lines.
    function compactCrowdedEvents() {
        document.querySelectorAll('.fc-timegrid-event').forEach(event => {
            if (event.classList.contains('fc-timegrid-event-short')) return;
            const title = event.querySelector('.fc-event-title');
            const time = event.querySelector('.fc-event-time');
            if (!title || !time) return;

            const range = document.createRange();
            range.selectNodeContents(title);
            const line = Array.from(range.getClientRects()).find(rect => rect.height > 0);
            if (!line) return;

            const available = event.clientHeight - time.getBoundingClientRect().height;
            if (available < line.height * 2) {
                event.classList.add('fc-timegrid-event-short');
            }
        });
    }

    // FullCalendar clips an overflowing title mid-word and can leave a half-height
    // row of letters at the bottom of a box. Clamp each title to the lines that
    // actually fit, which both ends it on an ellipsis and removes the sliced row.
    //
    // The line boxes are measured rather than derived from line-height: computed
    // line-height is often the keyword "normal", and estimating it from the font
    // size rounds down often enough to throw away a line that would have fitted.
    function clampEventTitles() {
        document.querySelectorAll('.fc-event-title').forEach(title => {
            const box = title.closest('.fc-event');
            if (!box) return;

            const range = document.createRange();
            range.selectNodeContents(title);
            const lines = Array.from(range.getClientRects()).filter(rect => rect.height > 0);
            if (lines.length < 2) return;          // one line: CSS ellipsis handles it

            // A line counts as fitting only if its whole height is inside the box.
            const limit = box.getBoundingClientRect().top + box.clientHeight;
            const fitting = lines.filter(rect => rect.bottom <= limit + 0.5).length;
            if (fitting >= lines.length) return;   // all of it fits already

            title.style.display = '-webkit-box';
            title.style.webkitBoxOrient = 'vertical';
            title.style.webkitLineClamp = String(Math.max(1, fitting));
            title.style.overflow = 'hidden';
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');
        const timeFormat = {
            hour: "numeric",
            minute: "2-digit",
            omitZeroMinute: {{ (time_format == "12h") | tojson }},
            hour12: {{ (time_format == "12h") | tojson }},
            meridiem: 'short'
        };

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: '{{ view }}',
            events: events,
            now: '{{ current_dt }}',
            {# initialDate is separate from now, so a day offset can render tomorrow
               (or last week) while "now" stays the real clock time. #}
            initialDate: '{{ initial_date }}',
            timeZone: '{{ timezone }}',
            contentHeight: '100%',
            slotDuration: '01:00:00',
            expandRows: true,
            locale: locale,
            firstDay: "{{ plugin_settings.weekStartDay or 0}}",
            slotLabelFormat: timeFormat,
            slotMinTime: "{{ plugin_settings.startTimeInterval or 00}}:00:00",
            slotMaxTime: "{{ plugin_settings.endTimeInterval or 24}}:00:00",
            eventTimeFormat: timeFormat,
            displayEventTime: {{ (plugin_settings.displayEventTime == "true") | tojson}},
            weekends:  {{ (plugin_settings.displayWeekends == "true") | tojson}},
            nowIndicator: {{ show_now_indicator | tojson }},
            {# Overlapping events sit side by side rather than stacked: the default
               lets a later event cover an earlier one, hiding its title mid-word with
               no way for the reader to uncover it on a static panel. #}
            slotEventOverlap: false,
            fixedWeekCount: false,
            {# The row is dropped outright when nothing is in it, so an empty "all-day"
               label can never steal height from the time grid. #}
            allDaySlot: {{ (all_day_lines > 0) | tojson }},
            {# Rewriting the chip after mount keeps FullCalendar's own rendering
               intact for every real event. #}
            eventDidMount: function (arg) {
                const count = arg.event.extendedProps.overflowCount;
                if (!count) return;
                arg.el.innerHTML = '';
                const label = document.createElement('div');
                label.className = 'fc-all-day-overflow';
                label.textContent = overflowLabel(count);
                arg.el.appendChild(label);
            },
            eventOrder: function (a, b) {
                // The overflow chip always trails the events it stands in for.
                const chip = (a.overflowCount ? 1 : 0) - (b.overflowCount ? 1 : 0);
                if (chip) return chip;
                if (a.start && b.start && a.start - b.start) return a.start - b.start;
                return (a.title || '').localeCompare(b.title || '');
            },
            {% if view == 'timeGrid' %}duration: {days : 7 },{% endif %}
            {% if view == 'dayGrid' %}duration: {weeks : {{ day_grid_weeks }} },{% endif %}
            headerToolbar: {
                left: '',
                center: "{{ 'title' if plugin_settings.displayTitle == 'true' else '' }}",
                right: ''
            },
            slotDuration: "01:00:00"
        });
        calendar.render();
        // Two frames so the grid has finished sizing before titles are measured.
        requestAnimationFrame(() => requestAnimationFrame(() => {
            compactCrowdedEvents();
            clampEventTitles();
        }));
    });
</script>

{% endblock %}
